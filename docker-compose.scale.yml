version: '3.8'

services:
  # Shared Distributed Redis Cache (Maintains single atomic rate-limit counter)
  redis:
    image: redis:7-alpine
    container_name: scale_redis
    ports:
      - "6379:6379"
    volumes:
      - scale-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Shared MongoDB Database (Audit trails and rate-limit configurations)
  mongodb:
    image: mongo:7-jammy
    container_name: scale_mongodb
    ports:
      - "27017:27017"
    volumes:
      - scale-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Backend Instance 1 (Emits X-Server-Instance: server-1)
  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scale_backend_1
    environment:
      - PORT=5000
      - NODE_ENV=production
      - SERVER_INSTANCE_ID=server-1
      - MONGO_URI=mongodb://mongodb:27017/rate_limiter
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_jwt_key_system_design_12345
      - JWT_EXPIRES_IN=7d
      - RATE_LIMIT_FAIL_MODE=closed
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  # Backend Instance 2 (Emits X-Server-Instance: server-2)
  backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scale_backend_2
    environment:
      - PORT=5000
      - NODE_ENV=production
      - SERVER_INSTANCE_ID=server-2
      - MONGO_URI=mongodb://mongodb:27017/rate_limiter
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_jwt_key_system_design_12345
      - JWT_EXPIRES_IN=7d
      - RATE_LIMIT_FAIL_MODE=closed
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  # Nginx Load Balancer (Distributes incoming requests across backend-1 and backend-2)
  load-balancer:
    image: nginx:alpine
    container_name: scale_load_balancer
    ports:
      - "5000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
    restart: unless-stopped

  # React Single Page Application Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scale_frontend
    ports:
      - "3000:80"
    depends_on:
      - load-balancer
    restart: unless-stopped

volumes:
  scale-redis-data:
  scale-mongo-data:
