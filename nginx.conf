events {
    worker_connections 1024;
}

http {
    # Upstream cluster of stateless Express backend servers
    # Nginx distributes incoming API traffic across all instances using Round-Robin
    upstream backend_cluster {
        server backend-1:5000;
        server backend-2:5000;
    }

    server {
        listen 80;

        # Forward API traffic to the backend cluster
        location /api/ {
            proxy_pass http://backend_cluster/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Ensure response headers from backends (X-Server-Instance, X-RateLimit-*) are preserved
            proxy_pass_header X-Server-Instance;
            proxy_pass_header X-RateLimit-Limit;
            proxy_pass_header X-RateLimit-Remaining;
            proxy_pass_header X-RateLimit-Reset;
            proxy_pass_header Retry-After;
        }

        # Health check endpoint for load balancer
        location /health {
            access_log off;
            return 200 'Load balancer healthy';
        }
    }
}
