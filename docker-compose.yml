version: '3.8'

services:
  # Distributed In-Memory Cache for Atomic Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: rate_limiter_redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Persistent Document Database for Users, Configurations, and Request Analytics
  mongodb:
    image: mongo:7-jammy
    container_name: rate_limiter_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Stateless Express Backend API Instance
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rate_limiter_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - SERVER_INSTANCE_ID=server-1
      - MONGO_URI=mongodb://mongodb:27017/rate_limiter
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_jwt_key_system_design_12345
      - JWT_EXPIRES_IN=7d
      - RATE_LIMIT_FAIL_MODE=closed
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  # React Single Page Application (Served by Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rate_limiter_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis-data:
  mongo-data:
